<!doctype html><html><head><meta charset="utf-8"><title>Kayıt</title></head><body style="font:16px sans-serif;padding:40px">
<h2>Hesap oluştur</h2><form id="f" action="/welcome.html" method="get"><p><input id="u" name="email" type="email" placeholder="E-posta" style="width:320px;padding:8px" value="yeni@ornek.com"></p>
<p><input id="p1" name="new_password" type="password" autocomplete="new-password" maxlength="16" passwordrules="required: lower; required: upper; required: digit; allowed: [-_]" placeholder="Parola" style="width:320px;padding:8px"></p>
