name: Güvenlik taraması

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Araçlar
        run: python -m pip install bandit pip-audit
      - name: Bandit (orta ve yüksek önem)
        run: bandit -r studio_ui gui.py native_host.py packaging -ll
      - name: pip-audit (bağımlılık açıkları)
        run: pip-audit -r requirements.txt -r requirements-optional.txt -r packaging/requirements-build.txt
      - name: Gitleaks (sızmış gizli bilgi)
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
