name: Güvenlik taraması

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 4 * * 3"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
      - name: Araçlar
        run: python -m pip install bandit pip-audit
      - name: Bandit (orta ve yüksek önem)
        run: bandit -r studio_ui gui.py native_host.py packaging -ll
      - name: pip-audit (bağımlılık açıkları)
        run: pip-audit -r requirements.txt -r requirements-optional.txt -r packaging/requirements-build.txt
      - name: Gitleaks (sızmış gizli bilgi)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
